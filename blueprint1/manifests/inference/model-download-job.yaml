# Downloads the model once into the shared hostPath cache so the 5 vLLM pods
# don't race each other (and HF rate limits) on first boot.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: inference
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: download
        image: ${APP_IMAGE}
        imagePullPolicy: Never
        command: ["python3", "-c"]
        args:
        - "from huggingface_hub import snapshot_download; print('downloaded to', snapshot_download('${MODEL_ID}', allow_patterns=['*.json', '*.safetensors', '*.txt', '*.model', '*.tiktoken']))"
        env:
        - { name: NVIDIA_VISIBLE_DEVICES, value: void }
        - name: HF_TOKEN
          valueFrom: { secretKeyRef: { name: hf-token, key: token, optional: true } }
        volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
      volumes:
      - name: hf-cache
        hostPath: { path: ${HF_CACHE_DIR}, type: DirectoryOrCreate }
