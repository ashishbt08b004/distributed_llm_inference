# SGLang router, cache_aware policy, addressing each decode pod individually
# (the blueprint pointed it at the ClusterIP service, which hides the pods behind
# kube-proxy load balancing and defeats prefix-aware routing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgl-router
  namespace: inference
spec:
  replicas: 1
  selector: { matchLabels: { app: sgl-router } }
  template:
    metadata:
      labels: { app: sgl-router, tier: router }
    spec:
      containers:
      - name: router
        image: ${ROUTER_PY_IMAGE}
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install --no-cache-dir -q "sglang-router==${SGLANG_ROUTER_VERSION}" && \
          exec python -m sglang_router.launch_router \
            --host 0.0.0.0 --port 8080 \
            --policy cache_aware \
            --worker-urls ${ROUTER_DECODE_URLS} \
            --prometheus-host 0.0.0.0 --prometheus-port 29000
        ports:
        - { containerPort: 8080, name: http }
        - { containerPort: 29000, name: metrics }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          periodSeconds: 5
          failureThreshold: 60
        resources:
          requests: { cpu: "500m", memory: "512Mi" }
          limits:   { cpu: "2",    memory: "2Gi" }
