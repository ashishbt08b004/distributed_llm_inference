# Phase 4 smoke test of the app image ON the GPU. Build-time checks can't load
# CUDA (no GPU, no driver), so an image whose vLLM and torch disagree on CUDA
# only fails once a vLLM pod starts. This pod does the same imports on a small
# HAMi slice and exits, so a broken image fails Phase 4, not Phase 5.
apiVersion: v1
kind: Pod
metadata:
  name: image-gpu-check
spec:
  restartPolicy: Never
  schedulerName: hami-scheduler
  containers:
  - name: check
    image: ${APP_IMAGE}
    imagePullPolicy: Never
    command: ["python3", "-c"]
    args:
    - |
      import importlib, importlib.util
      import torch
      assert torch.cuda.is_available(), "torch sees no GPU"
      assert torch.ones(1024, device="cuda").sum().item() == 1024
      from vllm.platforms import current_platform          # loads vLLM's CUDA extension
      assert current_platform.is_cuda(), f"vLLM platform is {current_platform!r}, not CUDA"
      for mod in ("vllm._C", "vllm._moe_C", "lmcache.c_ops"):   # compiled kernels, where present
          if importlib.util.find_spec(mod):
              importlib.import_module(mod)
      from mooncake.store import MooncakeDistributedStore
      import vllm, lmcache
      print(f"GPU CHECK OK: {torch.cuda.get_device_name(0)}, torch {torch.__version__} "
            f"(CUDA {torch.version.cuda}), vllm {vllm.__version__}")
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 2048
        nvidia.com/gpucores: 5
